lint:
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - .github/workflows/linting_comment.yml
  files_unchanged:
    - .gitattributes
    - assets/nf-core-phyloplace_logo_light.png
    - assets/nf-core-phyloplace_logo_dark.png
    - docs/images/nf-core-phyloplace_logo_light.png
    - docs/images/nf-core-phyloplace_logo_dark.png
    - .github/workflows/branch.yml
    - .github/workflows/linting.yml
  nextflow_config:
    - params.input
nf_core_version: 4.0.3
repository_type: pipeline
template:
  author: Daniel Lundin
  description: Performs phylogenetic placement with EPA-NG
  force: false
  is_nfcore: true
  name: phyloplace
  org: nf-core
  outdir: .
  skip_features:
    - igenomes
  version: 2.2.0dev
